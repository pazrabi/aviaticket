# Источники цен.
#
# source: api      HTTP-клиент без браузера (parser = имя клиента)
# source: browser  Playwright открывает url_template, дальше парсер из src/avia/parsers/
#                  (parser: имя) или, если use_llm: true, разбор через LLM
# phone:           id телефона для droidhub или auto (любой свободный из DROIDHUB_DEVICES в .env);
#                  если droidhub настроен, сбор идёт через телефон, иначе через Chromium
#
# Плейсхолдеры в url_template: {origin} {destination} {date_iso} {ddmm} {ddmmyyyy} {mm_dd} {adults}
# Коды городов IATA (MOW, ALA, TAS, MSQ, EVN ...).

sites:
  # Работает сразу после получения токена (TP_TOKEN в .env). Это кэш поисков Aviasales
  # за последние ~48 часов, не живая цена. Цена за одного пассажира умножается на число пассажиров.
  - name: aviasales_cache
    source: api
    parser: travelpayouts
    enabled: false
    url_template: ""
    note: "бесплатно, без браузера; цена может отличаться от живой"

  # Живая выдача Aviasales.
  - name: aviasales
    source: browser
    parser: aviasales
    enabled: true
    phone: "redmi,realme"   # сначала redmi, чтобы realme оставался для tutu и Яндекса
    phone_patience_seconds: 10
    phone_capture_json: ["/search/v3.2/results"]
    phone_wait_seconds: 45
    phone_wait_for: '"last_update_timestamp":0'
    url_template: "https://www.aviasales.ru/search/{origin}{ddmm}{destination}{adults}"
    url_template_rt: "https://www.aviasales.ru/search/{origin}{ddmm}{destination}{ddmm_ret}{adults}"
    settle_ms: 25000
    scrolls: 4
    note: "выдача грузится 30-60 секунд, поэтому большой settle_ms"

  # Живая выдача Купибилет.
  - name: kupibilet
    source: browser
    parser: kupibilet
    enabled: true
    phone: "redmi,realme"   # сначала redmi, чтобы realme оставался для tutu и Яндекса
    phone_patience_seconds: 15
    phone_wait_seconds: 30
    phone_capture_json: ["/frontend_search"]
    url_template: "https://www.kupibilet.ru/search?route%5B0%5D=iatax%3A{origin}_{date_iso}_date_{date_iso}_iatax%3A{destination}&adult={adults}&child=0&infant=0&childrenAges=%5B%5D&cabinClass=Y&v=2&filter=%7B%22transportKind%22%3A%7B%22Airplane%22%3Atrue%2C%22Train%22%3Afalse%7D%7D"
    url_template_rt: "https://www.kupibilet.ru/search?route%5B0%5D=iatax%3A{origin}_{date_iso}_date_{date_iso}_iatax%3A{destination}&route%5B1%5D=iatax%3A{destination}_{date_iso_ret}_date_{date_iso_ret}_iatax%3A{origin}&adult={adults}&child=0&infant=0&childrenAges=%5B%5D&cabinClass=Y&v=2&filter=%7B%22transportKind%22%3A%7B%22Airplane%22%3Atrue%2C%22Train%22%3Afalse%7D%7D"
    settle_ms: 15000
    scrolls: 2

  # Заглушки: шаблон URL нужно снять руками с реальной выдачи, потом recon и парсер.
  - name: tutu
    airports: false   # Туту и Т-Путешествия ищут только по городу, отдельный аэропорт не поддерживают
    source: browser
    parser: tutu
    id_resolver: tutu
    enabled: true
    phone: "realme,redmi"   # realme первым; redmi подхватывает, когда realme занят (замеры 2026-11-04)
    phone_patience_seconds: 5
    phone_wait_seconds: 25
    phone_capture_json: ["/avia/offers/v2"]
    url_template: "https://avia.tutu.ru/f/{origin_seo}/{destination_seo}/?class=Y&travelers={adults}&route[0]={origin_id}-{ddmmyyyy}-{destination_id}"
    url_template_rt: "https://avia.tutu.ru/f/{origin_seo}/{destination_seo}/?class=Y&travelers={adults}&route[0]={origin_id}-{ddmmyyyy}-{destination_id}&route[1]={destination_id}-{ddmmyyyy_ret}-{origin_id}"
    settle_ms: 20000
    scrolls: 2
    replay_post:
      url_contains: "/avia/offers/v2"
      set:
        sorting: cheapest
        limit: 100
        offset: 0
        isNewSearch: false

  - name: yandex_travel
    source: browser
    parser: yandex_travel
    id_resolver: yandex
    enabled: true
    phone: "realme,redmi"
    phone_patience_seconds: 5
    phone_wait_seconds: 30
    phone_full_wait_seconds: 45
    phone_full_wait_for: '"cont":null'
    phone_capture_json: ["/api/avia/search/results"]
    url_template: "https://travel.yandex.ru/avia/search/result/?adult_seats={adults}&children_seats=0&fromId={origin_id}&infant_seats=0&klass=economy&oneway=1&salesChannel=B2C&toId={destination_id}&when={date_iso}"
    url_template_rt: "https://travel.yandex.ru/avia/search/result/?adult_seats={adults}&children_seats=0&fromId={origin_id}&infant_seats=0&klass=economy&oneway=2&return_date={date_iso_ret}&salesChannel=B2C&toId={destination_id}&when={date_iso}"
    settle_ms: 30000
    scrolls: 1

  # Озон Тревел: шаблоны сняты со ссылки пользователя (route = туда+обратно кодами в нижнем регистре).
  # Выключен: антибот Озона отдаёт заглушку автоматическому браузеру (сначала recon в видимом окне).
  - name: ozon_travel
    source: browser
    parser: ozon_travel
    enabled: true
    phone: "redmi,realme"   # сначала redmi, чтобы realme оставался для tutu и Яндекса
    phone_patience_seconds: 10
    phone_wait_seconds: 30
    phone_capture_json: ["aviaSearchResult"]
    url_template: "https://www.ozon.ru/travel/flight/search?Children=0&Dlts={adults}&Infants=0&ServiceClass=ECONOMY&dates=d{date_iso}&route={origin}{destination}"
    url_template_rt: "https://www.ozon.ru/travel/flight/search?Children=0&Dlts={adults}&Infants=0&ServiceClass=ECONOMY&dates=d{date_iso}d{date_iso_ret}&route={origin}{destination}{destination}{origin}"
    settle_ms: 30000
    scrolls: 1

  # Т-Путешествия: новый агрегатор (шаг 14 PLAN_SPEED.md), в боевом режиме с 2026-11-07 по решению владельца.
  - name: ttravel
    airports: false   # Туту и Т-Путешествия ищут только по городу, отдельный аэропорт не поддерживают
    source: browser
    parser: ttravel
    enabled: true
    # 2026-11-09: хаб снова отдаёт startStreaming (проверено на redmi9t), сайт опять в боевом режиме
    phone: "redmi9t,huawei2,galaxya12"
    phone_patience_seconds: 10
    phone_capture_json: ["startStreaming"]
    phone_wait_seconds: 30
    phone_wait_for: '"payload":{"offers"'
    url_template: "https://www.tbank-online.com/travel/flights/one-way/{origin}-{destination}/{mm_dd}/?adults={adults}&children=0&infants=0&cabin=Y&composite=0"
    url_template_rt: "https://www.tbank-online.com/travel/flights/multi-way/{origin}-{destination}/{mm_dd}/{destination}-{origin}/{mm_dd_ret}/?adults={adults}&children=0&infants=0&cabin=Y&composite=0"
    settle_ms: 25000
    scrolls: 2

  # City Travel: новый агрегатор, боевой режим (stage: live). Текстовая выдача, без перехвата JSON.
  - name: city_travel
    source: browser
    parser: city_travel
    enabled: true
    stage: live
    phone: "galaxya12,huawei2"
    phone_patience_seconds: 10
    phone_wait_seconds: 25
    url_template: "https://city.travel/avia/search/{origin}/{destination}/E/{dd_mm_yyyy}/0/{adults}-0-0/0/0/0/00000000000000000000000000000000"
    url_template_rt: "https://city.travel/avia/search/{origin}/{destination}/E/{dd_mm_yyyy}/{dd_mm_yyyy_ret}/{adults}-0-0/0/0/0/00000000000000000000000000000000?rt=RTA{destination}"
    settle_ms: 15000
    scrolls: 2

